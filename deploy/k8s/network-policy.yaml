# GateFrame microservice network isolation.
# Only the Gateway Deployment may reach service ports; clients must use Gateway.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateframe-gateway-ingress
  namespace: gateframe
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateframe-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateframe
      ports:
        - protocol: TCP
          port: 3000
---
