global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateframe-gateway
    metrics_path: /metrics
    static_configs:
      # Replace host/port for your deployment (K8s service DNS, load balancer, etc.)
      - targets: ["gateway:3000"]
        labels:
          environment: production

